apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn
  annotations:
    # Makes this the default gateway for labelled pods. It counts only in the operator's namespace.
    wireguard-operator.io/default: "true"
spec:
  # The cluster's own networks. Clients route these over the CNI, never through the tunnel, and the
  # Service's ClusterIP must fall inside one of them. Replace each placeholder with your cluster's;
  # docs/prerequisites.md shows how to find them.
  localCIDRs:
    - 10.244.0.0/16    # pod CIDR: replace with your cluster's pod CIDR
    - 10.96.0.0/12     # Service CIDR: replace with your cluster's Service CIDR
    - 192.168.0.0/24   # node CIDR: replace with the CIDR your nodes live in
  gluetun:
    # Provider credentials come from the Secret below, never inline.
    envFrom:
      - secretRef:
          name: vpn-provider
# yamllint disable-line rule:document-start
---
apiVersion: v1
kind: Secret
metadata:
  name: vpn-provider
type: Opaque
stringData:
  # gluetun's own variables for a WireGuard provider. Replace every value; see
  # https://github.com/qdm12/gluetun-wiki for your provider's.
  VPN_SERVICE_PROVIDER: <your provider, e.g. mullvad>
  WIREGUARD_PRIVATE_KEY: <your provider-issued WireGuard private key>
