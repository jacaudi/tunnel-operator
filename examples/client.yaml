# A client Deployment for the `vpn` server in 01-server.yaml, applied to the same namespace. The
# WireGuard client runs as a native sidecar (an init container with restartPolicy: Always) and
# routes the pod's internet traffic through the tunnel.
#
# - The namespace must allow NET_ADMIN: Pod Security level `privileged`.
# - Replace the image tag vX.Y.Z with the operator release in use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-client
# yamllint disable-line rule:document-start
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpn-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wireguard-operator-client
subjects:
  - kind: ServiceAccount
    name: vpn-client
# yamllint disable-line rule:document-start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: vpn-client
      volumes:
        - name: wg-key
          emptyDir:
            medium: Memory
      initContainers:
        # This must be the first init container, so that later init containers run inside the tunnel too.
        - name: wg-client
          image: ghcr.io/jacaudi/wireguard-operator/agent:vX.Y.Z  # replace vX.Y.Z with your operator release
          restartPolicy: Always
          args: ["client", "--wireguard", "vpn"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          volumeMounts:
            - name: wg-key
              mountPath: /var/run/wireguard
          # The startup probe holds the app containers until the tunnel is up and the routes are in place.
          # There is no liveness or readiness probe: the sidecar only configures, and the kernel datapath
          # runs without it, so a hung process leaks nothing. The kubelet restarts it if it exits.
          startupProbe:
            exec:
              command: ["agent", "client", "--check"]
            periodSeconds: 2
            failureThreshold: 90
      containers:
        - name: app
          image: curlimages/curl:8.17.0  # replace with your application; it starts once the tunnel is up
          command: ["sleep", "infinity"]
