# The permissions the client sidecar needs in a namespace whose pods attach to a Wireguard. It grants
# nothing until it is bound there: create a RoleBinding to it for the pods' ServiceAccount. The client
# reads only its own WireguardPeer, so it needs no access to the Wireguard, which may live elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-client
rules:
- apiGroups:
  - vpn.tunnel-operator.io
  resources:
  - wireguardpeers
  verbs:
  - create
  - delete
  - get
  - list
  - watch
