# namePrefix renames the policy, but kustomize does not know that a binding's spec.policyName points
# at it. Without this the rendered binding names a policy that does not exist, and the apiserver skips a
# binding whose policy is missing, so the backstop would be silently off: labelled pods would be admitted
# uninjected. That is fail open; a unit test pins the rendered name.
nameReference:
- kind: ValidatingAdmissionPolicy
  group: admissionregistration.k8s.io
  fieldSpecs:
  - kind: ValidatingAdmissionPolicyBinding
    group: admissionregistration.k8s.io
    path: spec/policyName
