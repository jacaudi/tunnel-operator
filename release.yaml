apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
  name: wireguard-controller-manager-metrics-service
  namespace: wireguard-system
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
  name: wireguard-controller-manager
  namespace: wireguard-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        wireguard-operator.io/component: operator
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        - --leader-elect
        - --agent-image=ghcr.io/jacaudi/wireguard-operator/agent:v0.1.0 # x-release-please-version
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/jacaudi/wireguard-operator/manager:v0.1.0 # x-release-please-version
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: false
          runAsUser: 65534
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
      serviceAccountName: wireguard-controller-manager
      terminationGracePeriodSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wireguard-operator-require-injection
  namespace: wireguard-system
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  validations:
  - expression: '!has(object.spec.hostNetwork) || !object.spec.hostNetwork'
    message: hostNetwork pods cannot be tunnelled
  - expression: has(object.spec.initContainers) && size(object.spec.initContainers)
      > 0 && object.spec.initContainers[0].name == 'wg-client' && has(object.spec.initContainers[0].restartPolicy)
      && object.spec.initContainers[0].restartPolicy == 'Always'
    message: the pod is labelled wireguard-operator.io/enabled=true but was not injected
      with the WireGuard sidecar. Check that exactly one Wireguard in the operator's
      namespace is annotated wireguard-operator.io/default=true, that the operator
      is running, and that the cluster serves MutatingAdmissionPolicy (Kubernetes
      1.34 and 1.35 need the beta enabled). The operator's log names the cause.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wireguard-operator-require-injection
  namespace: wireguard-system
spec:
  matchResources:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
    objectSelector:
      matchExpressions:
      - key: wireguard-operator.io/component
        operator: DoesNotExist
      matchLabels:
        wireguard-operator.io/enabled: "true"
  policyName: wireguard-operator-require-injection
  validationActions:
  - Deny
